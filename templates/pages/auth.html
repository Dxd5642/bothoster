{% extends base_template %}

{% block title %}Вход и Регистрация — BotHoster{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <!-- Вкладки переключения: Вход / Регистрация -->
                <ul class="nav nav-pills nav-justified mb-4" id="authTabs" role="tablist">
                    <li class="nav-item" role="presentation">
                        <button class="nav-link active" id="login-tab" data-bs-toggle="tab" data-bs-target="#login-panel" type="button">
                            Вход
                        </button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link" id="register-tab" data-bs-toggle="tab" data-bs-target="#register-panel" type="button">
                            Регистрация
                        </button>
                    </li>
                </ul>

                <div class="tab-content" id="authTabsContent">
                    <!-- Форма Входа -->
                    <div class="tab-pane fade show active" id="login-panel" role="tabpanel">
                        {% include "partials/auth/login_form.html" %}
                    </div>

                    <!-- Форма Регистрации -->
                    <div class="tab-pane fade" id="register-panel" role="tabpanel">
                        {% include "partials/auth/register_form.html" %}
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
